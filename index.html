<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- ICO-1 · el icono oficial entra por el MAESTRO en SVG: nítido en
         cualquier densidad de pestaña y una sola fuente de verdad. Los PNG
         derivados (manifest e iOS) salen de él con scripts/gen-icons.mjs. -->
    <link rel="icon" type="image/svg+xml" href="/icons/ajilei-icon-maestro.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PWA-M1 · instalabilidad. El manifest nace con orientation "any": la app
         responde a las cuatro orientaciones por CSS y jamás fuerza una desde
         código (doctrina de AJILEI_Diseno_Landscape_v1.0 §1). theme-color
         espeja el del manifest — mismo token --green-abyss, que es lo que el
         body ya pinta. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a1e10" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <!-- ══ PUE-1.1 · La primera línea que alguien lee de AJILEI ═══════════════
         El título y la descripción son los de la lámina v1.7, palabra por
         palabra: es lo que Victor selló y es lo que sale en la pestaña, en el
         resultado de búsqueda y bajo el enlace compartido. -->
    <title>AJILEI — La mesa te espera</title>
    <meta
      name="description"
      content="AJILEI, el juego de cartas venezolano. Gratis y sin descargas: entra con tu correo y juega."
    />

    <!-- ══ Open Graph · la tarjeta del enlace compartido ═════════════════════
         `og:url` y `og:image` van ABSOLUTAS a propósito: la especificación las
         pide así y los rastreadores de WhatsApp, Facebook y X no resuelven
         rutas relativas de forma fiable. El origen canónico es `ajilei.io`, y
         sólo ése: el `.com` homónimo que nombran las fichas de identidad es de
         un tercero desde junio de 2026 y apuntar ahí una tarjeta sería regalarle
         el enlace. Son TRES líneas —`og:url`, `og:image` y `twitter:image`— y
         las tres dicen el mismo origen a propósito.

         La imagen NO es un derivado con hash de Vite: vive en `public/` con
         nombre estable porque un rastreador la cachea por URL, y una URL que
         cambia en cada build es una tarjeta que se rompe sola.

         CAP-1 · pero estable no es eterno: el nombre se VERSIONA A MANO
         (`og-image-v2.jpg`) cada vez que cambia la imagen. WhatsApp, Facebook y
         compañía guardan la tarjeta por URL durante días o semanas, así que una
         imagen nueva con el nombre viejo seguiría enseñando la vieja. El nombre
         sale de `OG_DESTINO` en `scripts/gen-portada-assets.mjs`, que la escribe
         desde la maestra sellada `maestras/portada/mesah.png`; al subir el
         número allí, se sube en las DOS líneas de abajo. La versión anterior
         (`og-image.jpg`) se conserva en `public/` una campaña para las tarjetas
         que ya la tienen en caché. `_headers` limita a un día la caché de
         `/og-image*` en los intermediarios. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AJILEI" />
    <meta property="og:locale" content="es_VE" />
    <meta property="og:title" content="AJILEI — La mesa te espera" />
    <meta
      property="og:description"
      content="AJILEI, el juego de cartas venezolano. Gratis y sin descargas: entra con tu correo y juega."
    />
    <meta property="og:url" content="https://ajilei.io/" />
    <meta property="og:image" content="https://ajilei.io/og-image-v2.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="La mesa de AJILEI con las cartas repartidas." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AJILEI — La mesa te espera" />
    <meta
      name="twitter:description"
      content="AJILEI, el juego de cartas venezolano. Gratis y sin descargas: entra con tu correo y juega."
    />
    <meta name="twitter:image" content="https://ajilei.io/og-image-v2.jpg" />

    <!-- ══ El seguro de una línea del standalone en iOS (Fase 0 §3.4) ════════
         Safari NO lee `display: standalone` del manifest: para iOS la señal
         sigue siendo esta meta. Sin ella, «Añadir a pantalla de inicio» abre
         AJILEI dentro de Safari con su barra de direcciones encima; con ella,
         a pantalla completa. `black-translucent` deja que el verde abismo del
         body llegue hasta la barra de estado en vez de dejar una franja negra.
         El título de la meta es el nombre corto que iOS pone bajo el icono. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AJILEI" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
